<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400">
  <defs>
    <clipPath id="bClip">
      <rect x="0" y="30" width="280" height="350" rx="20"/>
    </clipPath>
  </defs>

  <!-- B block background -->
  <rect x="10" y="40" width="270" height="340" rx="22" fill="#E8593C"/>

  <!-- B letter - top bowl -->
  <path d="M70,80 L70,200 L180,200 C220,200 240,180 240,160 C240,120 220,100 180,80 Z" fill="#E8593C" stroke="#fff" stroke-width="14" stroke-linejoin="round"/>
  <!-- B letter - bottom bowl -->
  <path d="M70,200 L70,330 L190,330 C235,330 255,300 255,270 C255,235 235,210 190,200 Z" fill="#E8593C" stroke="#fff" stroke-width="14" stroke-linejoin="round"/>
  <!-- B spine highlight -->
  <line x1="70" y1="80" x2="70" y2="330" stroke="#fff" stroke-width="14" stroke-linecap="round"/>

  <!-- Shuttlecock -->
  <g transform="translate(75, 240) scale(0.9)" fill="#fff" opacity="0.95">
    <!-- Cork base -->
    <ellipse cx="30" cy="95" rx="14" ry="10"/>
    <!-- Feathers -->
    <path d="M16,90 C5,60 8,20 30,0 C20,25 18,55 22,85 Z" fill="#fff"/>
    <path d="M44,90 C55,60 52,20 30,0 C40,25 42,55 38,85 Z" fill="#fff"/>
    <path d="M24,88 C15,55 18,20 30,0 C25,25 22,55 26,84 Z" fill="#fff"/>
    <path d="M36,88 C45,55 42,20 30,0 C35,25 38,55 34,84 Z" fill="#fff"/>
    <path d="M30,87 C30,55 30,20 30,0 C30,25 30,55 30,84 Z" fill="#fff"/>
    <!-- Feather bands -->
    <line x1="12" y1="45" x2="48" y2="45" stroke="#E8593C" stroke-width="1.5"/>
    <line x1="14" y1="60" x2="46" y2="60" stroke="#E8593C" stroke-width="1.5"/>
    <line x1="16" y1="75" x2="44" y2="75" stroke="#E8593C" stroke-width="1.5"/>
  </g>

  <!-- Player silhouette and A shape -->
  <g fill="#D4C4A8">
    <!-- A-frame / legs -->
    <path d="M260,380 L330,150 L340,150 L410,380 L380,380 L355,280 L315,280 L290,380 Z"/>
    <!-- A crossbar as swoosh -->
    <path d="M240,330 Q300,280 370,300 Q340,270 240,330 Z"/>

    <!-- Player body -->
    <!-- Head -->
    <circle cx="340" cy="55" r="18"/>
    <!-- Torso -->
    <path d="M325,73 C320,90 315,120 320,150 L355,150 C358,120 355,90 350,73 Z"/>
    <!-- Racket arm (right, raised) -->
    <path d="M350,85 C365,70 380,50 390,30 L396,36 C385,55 370,78 355,93 Z"/>
    <!-- Left arm -->
    <path d="M325,85 C310,100 295,115 285,120 L290,128 C302,122 318,108 330,95 Z"/>
    <!-- Right leg -->
    <path d="M345,150 C350,180 360,220 375,260 L365,265 C350,225 342,185 340,155 Z"/>
    <!-- Left leg -->
    <path d="M330,150 C320,185 305,225 290,260 L300,265 C315,228 325,188 335,155 Z"/>

    <!-- Racket -->
    <ellipse cx="398" cy="18" rx="18" ry="22" fill="none" stroke="#D4C4A8" stroke-width="4" transform="rotate(-15, 398, 18)"/>
    <line x1="390" y1="30" x2="395" y2="24" stroke="#D4C4A8" stroke-width="4"/>
    <!-- Racket strings -->
    <line x1="390" y1="8" x2="406" y2="8" stroke="#D4C4A8" stroke-width="1" transform="rotate(-15, 398, 18)"/>
    <line x1="390" y1="18" x2="406" y2="18" stroke="#D4C4A8" stroke-width="1" transform="rotate(-15, 398, 18)"/>
    <line x1="395" y1="0" x2="395" y2="32" stroke="#D4C4A8" stroke-width="1" transform="rotate(-15, 398, 18)"/>
    <line x1="401" y1="0" x2="401" y2="32" stroke="#D4C4A8" stroke-width="1" transform="rotate(-15, 398, 18)"/>
  </g>
</svg>
